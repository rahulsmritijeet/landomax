<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitions - ATL Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🔬</div>
                Throttle by RahulS
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="components.html" class="nav-link">Components</a>
                <a href="competitions.html" class="nav-link active">Competitions</a>
                <a href="orders.html" class="nav-link">Orders</a>
                <div class="nav-divider"></div>
                <button class="nav-link logout-btn" onclick="logout()">Logout</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title">🏆 Competitions</h1>
            <div class="header-actions">
                <input type="text" id="searchCompetitions" class="search-input" placeholder="🔍 Search competitions..." oninput="searchCompetitions()">
                <div class="view-toggle">
                    <button class="btn btn-sm active" onclick="toggleView('table', this)">📋 Table</button>
                    <button class="btn btn-sm" onclick="toggleView('calendar', this)">📅 Calendar</button>
                </div>
                <a href="competition_form.html" class="btn btn-primary">➕ Add Competition</a>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card warning">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <span class="stat-value" id="upcomingCount">0</span>
                    <span class="stat-label">Upcoming</span>
                </div>
            </div>
            <div class="stat-card info">
                <div class="stat-icon">🔄</div>
                <div class="stat-info">
                    <span class="stat-value" id="ongoingCount">0</span>
                    <span class="stat-label">Ongoing</span>
                </div>
            </div>
            <div class="stat-card success">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-info">
                    <span class="stat-value" id="totalCompetitions">0</span>
                    <span class="stat-label">Total</span>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterCompetitions('all', this)">📋 All</button>
            <button class="filter-tab" onclick="filterCompetitions('Upcoming', this)">📅 Upcoming</button>
            <button class="filter-tab" onclick="filterCompetitions('Ongoing', this)">🔄 Ongoing</button>
            <button class="filter-tab" onclick="filterCompetitions('Completed', this)">✅ Completed</button>
        </div>

        <!-- Table View -->
        <div id="tableView" class="card">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Event Name</th>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="competitionsTableBody">
                        <tr>
                            <td colspan="7" class="loading-cell">
                                <div class="spinner-small"></div> Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="calendarView" class="calendar-grid" style="display: none;">
            <!-- Calendar cards will be loaded here -->
        </div>
    </main>

    <!-- View Competition Modal -->
    <div class="modal" id="competitionModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 id="modalCompetitionName">Competition Details</h3>
                <button class="modal-close" onclick="closeCompetitionModal()">✕</button>
            </div>
            <div class="modal-body" id="modalCompetitionBody"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="modalCompEditBtn">✏️ Edit</button>
                <button class="btn btn-secondary" onclick="closeCompetitionModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Update Result Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🏆 Update Result</h3>
                <button class="modal-close" onclick="closeResultModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="resultEventId">
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="resultStatus" class="form-control">
                        <option value="Upcoming">📅 Upcoming</option>
                        <option value="Ongoing">🔄 Ongoing</option>
                        <option value="Completed">✅ Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Position / Result</label>
                    <input type="text" id="resultPosition" class="form-control" placeholder="e.g., 1st Place, Winner, Finalist">
                </div>
                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea id="resultNotes" class="form-control" rows="3" placeholder="Additional notes about the result..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="saveResult()">💾 Save Result</button>
                <button class="btn btn-secondary" onclick="closeResultModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof checkAuth === 'function' && !checkAuth()) return;
            loadCompetitions();
        });
    </script>
</body>
</html>
