<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form - ATL Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🔬</div>
                ATL Dashboard
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link active">Projects</a>
                <a href="components.html" class="nav-link">Components</a>
                <a href="competitions.html" class="nav-link">Competitions</a>
                <a href="orders.html" class="nav-link">Orders</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title" id="formTitle">Add New Project</h1>
        </div>

        <div class="card">
            <form id="projectForm" onsubmit="saveProject(event)">
                <input type="hidden" id="projectId">

                <div class="form-group">
                    <label class="form-label">
                        Project Name <span class="required">*</span>
                    </label>
                    <input type="text" id="projectName" class="form-control" required placeholder="Enter project name">
                </div>

                <div class="form-group">
                    <label class="form-label">Overview</label>
                    <textarea id="overview" class="form-control" placeholder="Brief overview of the project"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Code / Notes</label>
                    <textarea id="code" class="form-control code-textarea" placeholder="Code snippets, links, or additional notes"></textarea>
                </div>

                <!-- Enhanced Components Selection -->
                <div class="form-group">
                    <label class="form-label">
                        Components Used
                        <span class="selected-count" id="selectedCount">(0 selected)</span>
                    </label>
                    
                    <!-- Search Bar -->
                    <div class="component-search-wrapper">
                        <div class="search-input-container">
                            <span class="search-icon">🔍</span>
                            <input 
                                type="text" 
                                id="componentSearch" 
                                class="search-input-field" 
                                placeholder="Search components by name, type, or ID..."
                                oninput="searchComponentsInForm(this.value)"
                                autocomplete="off"
                            >
                            <button type="button" class="clear-search-btn" onclick="clearComponentSearch()" title="Clear search">✕</button>
                        </div>
                        
                        <!-- Quick Filters -->
                        <div class="quick-filters">
                            <button type="button" class="filter-chip active" onclick="filterByType('all')">All</button>
                            <button type="button" class="filter-chip" onclick="filterByType('Microcontroller')">🎛️ Microcontroller</button>
                            <button type="button" class="filter-chip" onclick="filterByType('Sensor')">📡 Sensor</button>
                            <button type="button" class="filter-chip" onclick="filterByType('Motor')">⚙️ Motor</button>
                            <button type="button" class="filter-chip" onclick="filterByType('LED')">💡 LED</button>
                            <button type="button" class="filter-chip" onclick="filterByType('Module')">📦 Module</button>
                            <button type="button" class="filter-chip" onclick="filterByType('Wire')">🔌 Wire</button>
                            <button type="button" class="filter-chip" onclick="filterByType('other')">📋 Other</button>
                        </div>
                        
                        <!-- Selection Actions -->
                        <div class="selection-actions">
                            <button type="button" class="btn btn-sm btn-secondary" onclick="selectAllVisible()">
                                ☑️ Select All Visible
                            </button>
                            <button type="button" class="btn btn-sm btn-secondary" onclick="deselectAll()">
                                ⬜ Deselect All
                            </button>
                            <span class="results-count" id="resultsCount">Loading...</span>
                        </div>
                    </div>
                    
                    <!-- Components List -->
                    <div id="componentsUsed" class="checkbox-group enhanced">
                        <div class="loading-components">
                            <div class="spinner-small"></div>
                            Loading components...
                        </div>
                    </div>
                    
                    <!-- Selected Components Preview -->
                    <div class="selected-preview" id="selectedPreview">
                        <div class="selected-preview-header">
                            <span>📦 Selected Components:</span>
                        </div>
                        <div class="selected-chips" id="selectedChips">
                            <span class="no-selection">No components selected</span>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">
                        <span>💾</span> Save Project
                    </button>
                    <a href="projects.html" class="btn btn-secondary">
                        <span>❌</span> Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadProjectForm);
        
        // Keyboard shortcut: Ctrl+F or Cmd+F to focus search
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('componentSearch').focus();
            }
        });
    </script>
</body>
</html>
