<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Form - ATL Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🔬</div>
                Throttle by RahulS
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="components.html" class="nav-link">Components</a>
                <a href="competitions.html" class="nav-link active">Competitions</a>
                <a href="orders.html" class="nav-link">Orders</a>
                <div class="nav-divider"></div>
                <button class="nav-link logout-btn" onclick="logout()">Logout</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title" id="formTitle">Add New Competition</h1>
        </div>

        <form id="competitionForm" onsubmit="saveCompetition(event)">
            <input type="hidden" id="eventId">

            <!-- Basic Info -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">🏆 Event Information</h3>
                </div>

                <div class="form-group">
                    <label class="form-label">Event Name <span class="required">*</span></label>
                    <input type="text" id="eventName" class="form-control" required placeholder="e.g., ATL Marathon 2024, Science Fair">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Start Date <span class="required">*</span></label>
                        <input type="date" id="eventDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Date</label>
                        <input type="date" id="endDate" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <input type="text" id="location" class="form-control" placeholder="e.g., School Auditorium, IIT Delhi">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-control">
                            <option value="Upcoming">📅 Upcoming</option>
                            <option value="Ongoing">🔄 Ongoing</option>
                            <option value="Completed">✅ Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Details / Description</label>
                    <textarea id="details" class="form-control" rows="3" placeholder="Event details, rules, categories..."></textarea>
                </div>
            </div>

            <!-- Participants & Results -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">👥 Participants & Results</h3>
                </div>

                <div class="form-group">
                    <label class="form-label">Participants / Team Members</label>
                    <textarea id="participants" class="form-control" rows="2" placeholder="Enter participant names, separated by commas"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Result</label>
                        <select id="result" class="form-control">
                            <option value="">-- Select Result --</option>
                            <option value="Winner">🥇 Winner</option>
                            <option value="1st Place">🥇 1st Place</option>
                            <option value="2nd Place">🥈 2nd Place</option>
                            <option value="3rd Place">🥉 3rd Place</option>
                            <option value="Finalist">🏅 Finalist</option>
                            <option value="Participant">📋 Participant</option>
                            <option value="Special Mention">⭐ Special Mention</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Position / Rank</label>
                        <input type="text" id="position" class="form-control" placeholder="e.g., 1st, Top 10, Zonal Winner">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea id="notes" class="form-control" rows="3" placeholder="Additional notes, achievements, learnings..."></textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions-fixed">
                <button type="submit" class="btn btn-success btn-lg">💾 Save Competition</button>
                <a href="competitions.html" class="btn btn-secondary btn-lg">❌ Cancel</a>
            </div>
        </form>
    </main>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof checkAuth === 'function' && !checkAuth()) return;
            loadCompetitionForm();
        });
    </script>
</body>
</html>
