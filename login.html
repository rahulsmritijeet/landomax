<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ATL Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Login Page Specific Styles */
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 14px;
            margin: 0;
        }

        .login-body {
            padding: 40px 30px;
        }

        .login-form .form-group {
            margin-bottom: 24px;
        }

        .login-form .form-label {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            color: #374151;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-input-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner-small {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .login-footer {
            text-align: center;
            padding: 20px 30px 30px;
            color: #6b7280;
            font-size: 13px;
        }

        .login-footer a {
            color: #4f46e5;
            text-decoration: none;
        }

        /* Remember me checkbox */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
        }

        /* Animated background */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .bg-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .bg-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 5s;
        }

        .bg-shape:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        /* Caps lock warning */
        .caps-warning {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #fef3c7;
            color: #d97706;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 8px;
        }

        .caps-warning.show {
            display: flex;
        }
    </style>
</head>
<body class="login-page">
    <!-- Animated Background -->
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🔬</div>
                <h1>ATL Dashboard</h1>
                <p>Atal Tinkering Lab Management System</p>
            </div>

            <div class="login-body">
                <div class="error-message" id="errorMessage">
                    <span>⚠️</span>
                    <span id="errorText">Invalid password. Please try again.</span>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">🔒 Password</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-control" 
                                placeholder="Enter your password"
                                required
                                autofocus
                                onkeyup="checkCapsLock(event)"
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                👁️
                            </button>
                        </div>
                        <div class="caps-warning" id="capsWarning">
                            <span>⚠️</span> Caps Lock is ON
                        </div>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <label for="rememberMe">Keep me logged in for 7 days</label>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span id="loginBtnText">🚀 Login to Dashboard</span>
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <p>Protected access. Contact administrator if you forgot the password.</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            if (isLoggedIn()) {
                window.location.href = 'index.html';
            }
        });

        function isLoggedIn() {
            const session = localStorage.getItem('atl_session');
            if (!session) return false;
            
            try {
                const sessionData = JSON.parse(session);
                const now = new Date().getTime();
                
                if (sessionData.expiry && now < sessionData.expiry) {
                    return true;
                } else {
                    localStorage.removeItem('atl_session');
                    return false;
                }
            } catch (e) {
                localStorage.removeItem('atl_session');
                return false;
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-password');
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function checkCapsLock(event) {
            const capsWarning = document.getElementById('capsWarning');
            if (event.getModifierState && event.getModifierState('CapsLock')) {
                capsWarning.classList.add('show');
            } else {
                capsWarning.classList.remove('show');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('show');
            
            // Shake animation
            errorDiv.style.animation = 'none';
            setTimeout(() => {
                errorDiv.style.animation = 'shake 0.5s ease-in-out';
            }, 10);
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            
            if (loading) {
                btn.disabled = true;
                btnText.innerHTML = '<div class="spinner-small"></div> Verifying...';
            } else {
                btn.disabled = false;
                btnText.innerHTML = '🚀 Login to Dashboard';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();
            setLoading(true);
            
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            try {
                const url = new URL(API_URL);
                url.searchParams.append('action', 'verifyPassword');
                url.searchParams.append('password', password);
                
                const response = await fetch(url.toString());
                const result = await response.json();
                
                if (result.success) {
                    // Calculate expiry
                    const now = new Date().getTime();
                    const expiry = rememberMe 
                        ? now + (7 * 24 * 60 * 60 * 1000) // 7 days
                        : now + (60 * 60 * 1000); // 1 hour
                    
                    // Save session
                    const sessionData = {
                        token: result.token,
                        expiry: expiry,
                        loginTime: now
                    };
                    
                    localStorage.setItem('atl_session', JSON.stringify(sessionData));
                    
                    // Redirect to dashboard
                    window.location.href = 'index.html';
                } else {
                    showError(result.error || 'Invalid password. Please try again.');
                    document.getElementById('password').select();
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please check your internet and try again.');
            }
            
            setLoading(false);
        }

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // Enter key support
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
