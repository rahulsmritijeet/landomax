<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ATL Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 14px;
            margin: 0;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #374151;
        }

        .password-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 14px 50px 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.5;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            padding: 20px 30px 30px;
            color: #6b7280;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Debug info */
        .debug-info {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
            display: none;
        }

        .debug-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🔬</div>
                <h1>Throttle by RahulS</h1>
                <p>Atal Tinkering Lab Management System</p>
            </div>

            <div class="login-body">
                <div class="error-message" id="errorMessage"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">🔒 Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-control" 
                                placeholder="Enter your password"
                                required
                                autofocus
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <label for="rememberMe">Keep me logged in for 7 days</label>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        🚀 Login to Dashboard
                    </button>
                </form>

                <div class="debug-info" id="debugInfo"></div>
            </div>

            <div class="login-footer">
                <p>Default password: <strong>admin123</strong></p>
                <p style="margin-top: 8px;">Contact administrator if you forgot the password.</p>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // CONFIGURATION - UPDATE THIS URL!
        // =====================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbyUlHYMRFkfWlhWbPy3W89_NYfxqvUTTTHE61XN9zzq84dbYB8mWFoVJ5Qr3TKiQVK_/exec';
        // Example: 'https://script.google.com/macros/s/AKfycbw.../exec'
        
        // =====================================================
        // Check if already logged in
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (isLoggedIn()) {
                window.location.href = 'index.html';
            }
        });

        function isLoggedIn() {
            const session = localStorage.getItem('atl_session');
            if (!session) return false;
            
            try {
                const sessionData = JSON.parse(session);
                const now = new Date().getTime();
                return sessionData.expiry && now < sessionData.expiry;
            } catch (e) {
                localStorage.removeItem('atl_session');
                return false;
            }
        }

        // =====================================================
        // Toggle Password Visibility
        // =====================================================
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-password');
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // =====================================================
        // Show/Hide Error
        // =====================================================
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function showDebug(info) {
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.textContent = info;
            debugDiv.classList.add('show');
        }

        // =====================================================
        // Set Loading State
        // =====================================================
        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Verifying...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '🚀 Login to Dashboard';
            }
        }

        // =====================================================
        // Handle Login
        // =====================================================
        async function handleLogin(event) {
            event.preventDefault();
            hideError();
            setLoading(true);
            
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            
            if (!password) {
                showError('Please enter a password');
                setLoading(false);
                return;
            }

            // Check if API_URL is configured
            if (API_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE' || !API_URL) {
                showError('API URL not configured! Please update the API_URL in login.html');
                setLoading(false);
                return;
            }
            
            try {
                console.log('Attempting login...');
                console.log('API URL:', API_URL);
                
                const url = new URL(API_URL);
                url.searchParams.append('action', 'verifyPassword');
                url.searchParams.append('password', password);
                
                console.log('Request URL:', url.toString());
                
                const response = await fetch(url.toString(), {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                console.log('Response status:', response.status);
                
                const text = await response.text();
                console.log('Response text:', text);
                
                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    showError('Invalid response from server. Check console for details.');
                    showDebug('Response: ' + text.substring(0, 200));
                    setLoading(false);
                    return;
                }
                
                console.log('Parsed result:', result);
                
                if (result.success) {
                    console.log('Login successful!');
                    
                    // Calculate expiry
                    const now = new Date().getTime();
                    const expiry = rememberMe 
                        ? now + (7 * 24 * 60 * 60 * 1000) // 7 days
                        : now + (60 * 60 * 1000); // 1 hour
                    
                    // Save session
                    const sessionData = {
                        token: result.token,
                        expiry: expiry,
                        loginTime: now
                    };
                    
                    localStorage.setItem('atl_session', JSON.stringify(sessionData));
                    
                    // Redirect to dashboard
                    window.location.href = 'index.html';
                } else {
                    console.log('Login failed:', result.error);
                    showError(result.error || 'Invalid password. Please try again.');
                    document.getElementById('password').select();
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error: ' + error.message);
                showDebug('Error details: ' + error.toString());
            }
            
            setLoading(false);
        }

        // Enter key support
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });
    </script>
</body>
</html>
