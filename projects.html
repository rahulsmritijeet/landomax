<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - ATL Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🔬</div>
                Throttle by RahulS
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link active">Projects</a>
                <a href="components.html" class="nav-link">Components</a>
                <a href="competitions.html" class="nav-link">Competitions</a>
                <div class="nav-divider"></div>
                <button class="nav-link logout-btn" onclick="logout()">🚪 Logout</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title">📁 Projects</h1>
            <div class="header-actions">
                <input type="text" id="searchProjects" class="search-input" placeholder="🔍 Search projects..." oninput="searchProjects()">
                <a href="project_form.html" class="btn btn-primary">
                    <span>➕</span> Add Project
                </a>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📁</div>
                <div class="stat-info">
                    <span class="stat-value" id="totalProjects">0</span>
                    <span class="stat-label">Total Projects</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <span class="stat-value" id="totalStudents">0</span>
                    <span class="stat-label">Students Involved</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚙️</div>
                <div class="stat-info">
                    <span class="stat-value" id="totalComponentsUsed">0</span>
                    <span class="stat-label">Components Used</span>
                </div>
            </div>
        </div>

        <!-- Projects List -->
        <div id="projectsContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading projects...</p>
            </div>
        </div>
    </main>

    <!-- Project Details Modal -->
    <div class="modal" id="projectModal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3 id="modalProjectName">Project Details</h3>
                <button class="modal-close" onclick="closeProjectModal()">✕</button>
            </div>
            <div class="modal-body" id="modalProjectBody">
                <!-- Content loaded dynamically -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="modalEditBtn">✏️ Edit Project</button>
                <button class="btn btn-secondary" onclick="closeProjectModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            loadProjects();
        });
    </script>
</body>
</html>
