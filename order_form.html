<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form - ATL Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <header class="header">
        <div class="header-content">
            <div class="logo"><div class="logo-icon">🔬</div>Throttle by RahulS</div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="components.html" class="nav-link">Components</a>
                <a href="competitions.html" class="nav-link">Competitions</a>
                <a href="orders.html" class="nav-link active">Orders</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title" id="formTitle">New Order</h1>
        </div>

        <form id="orderForm" onsubmit="saveOrder(event)">
            <input type="hidden" id="orderId">

            <div class="card">
                <div class="card-header"><h3>📦 Order Details</h3></div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Vendor <span class="required">*</span></label>
                        <input type="text" id="vendor" class="form-control" required placeholder="Amazon, Robu.in...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-control">
                            <option value="Ordered">🕐 Ordered</option>
                            <option value="Shipped">🚚 Shipped</option>
                            <option value="Delivered">📬 Delivered</option>
                            <option value="Completed">✅ Completed</option>
                            <option value="Cancelled">❌ Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Order Date</label>
                        <input type="date" id="orderDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Expected Delivery</label>
                        <input type="date" id="expectedDelivery" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea id="notes" class="form-control" rows="2" placeholder="Tracking info, notes..."></textarea>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📋 Order Items</h3>
                </div>
                
                <div class="add-item-form">
                    <div class="form-row">
                        <div class="form-group" style="flex:2">
                            <label class="form-label">Component Name</label>
                            <input type="text" id="itemName" class="form-control" placeholder="ESP32, Arduino Uno...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Type</label>
                            <input type="text" id="itemType" class="form-control" placeholder="Microcontroller">
                        </div>
                        <div class="form-group" style="flex:0.5">
                            <label class="form-label">Qty</label>
                            <input type="number" id="itemQuantity" class="form-control" value="1" min="1">
                        </div>
                        <div class="form-group" style="flex:0.3;align-self:flex-end">
                            <button type="button" class="btn btn-primary" onclick="addOrderItem()">➕ Add</button>
                        </div>
                    </div>
                </div>

                <div id="orderItemsContainer"></div>

                <div class="order-totals">
                    <span>Items: <strong id="totalItemsCount">0</strong></span>
                    <span>Total Qty: <strong id="totalQuantityCount">0</strong></span>
                </div>
            </div>

            <div class="form-actions-fixed">
                <button type="submit" class="btn btn-success btn-lg">💾 Save Order</button>
                <a href="orders.html" class="btn btn-secondary btn-lg">❌ Cancel</a>
            </div>
        </form>
    </main>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof checkAuth === 'function' && !checkAuth()) return;
            loadOrderForm();
        });
    </script>
</body>
</html>
